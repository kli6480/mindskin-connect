<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="100%" height="100%">
  <!-- 
    Minimal & Cute Body Outline for Progressive Muscle Relaxation
    - Transparent background
    - Black stroke
  -->
  
  <g stroke="#000000" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- Major Muscle Group Dividers (Subtle Dashed Lines) -->
    <!-- You can easily delete this group if you only want the pure outer shell! -->
    <g stroke-width="2" stroke-dasharray="4 6" opacity="0.4">
      <!-- Neck / Shoulders -->
      <path d="M 85 85 Q 100 95 115 85" />
      <!-- Chest / Abdomen -->
      <path d="M 62 140 Q 100 150 138 140" />
      <!-- Abdomen / Hips -->
      <path d="M 62 200 Q 100 210 138 200" />
      <!-- Shoulders / Arms -->
      <line x1="65" y1="95" x2="40" y2="105" />
      <line x1="135" y1="95" x2="160" y2="105" />
      <!-- Elbows -->
      <line x1="33" y1="140" x2="47" y2="140" />
      <line x1="153" y1="140" x2="167" y2="140" />
      <!-- Wrists -->
      <line x1="28" y1="175" x2="48" y2="175" />
      <line x1="152" y1="175" x2="172" y2="175" />
      <!-- Hips / Thighs -->
      <line x1="60" y1="230" x2="98" y2="245" />
      <line x1="140" y1="230" x2="102" y2="245" />
      <!-- Knees -->
      <line x1="58" y1="290" x2="82" y2="290" />
      <line x1="118" y1="290" x2="142" y2="290" />
      <!-- Ankles -->
      <line x1="55" y1="350" x2="80" y2="350" />
      <line x1="120" y1="350" x2="145" y2="350" />
    </g>

    <!-- Main Outer Body Shell -->
    <path stroke-width="5" d="
      M 100 20
      C 120 20, 130 35, 130 55
      C 130 70, 120 80, 115 85
      C 135 85, 155 95, 165 115
      C 175 135, 175 165, 170 185
      C 168 195, 152 195, 150 185
      C 145 160, 145 135, 140 120
      C 135 150, 135 190, 140 230
      C 145 280, 145 330, 145 350
      C 145 365, 120 365, 120 350
      C 120 310, 115 260, 100 250
      C 85 260, 80 310, 80 350
      C 80 365, 55 365, 55 350
      C 55 330, 55 280, 60 230
      C 65 190, 65 150, 60 120
      C 55 135, 55 160, 50 185
      C 48 195, 32 195, 30 185
      C 25 165, 25 135, 35 115
      C 45 95, 65 85, 85 85
      C 80 80, 70 70, 70 55
      C 70 35, 80 20, 100 20
      Z" 
    />
  </g>
</svg>
